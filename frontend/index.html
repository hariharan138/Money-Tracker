<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="apple-touch-icon" sizes="180x180" href="https://money-tracker-f6p4.onrender.com/icon-180.png">
  <link rel="icon" type="image/png" href="https://money-tracker-f6p4.onrender.com/icon-180.png">
  <title>Expenses</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">Good morning!</p><h1>My expenses</h1><p id="status" class="sync-status">Your spending overview</p></div>
      <button id="refresh" class="round" title="Refresh" aria-label="Refresh">↻</button>
    </header>

    <section class="hero" aria-label="Expense balance">
      <div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div>
      <button class="more" type="button" aria-label="More options">•••</button>
      <p class="card-label">TOTAL SPENT</p><strong id="total">₹0</strong><p id="total-sub">0 transactions</p>
      <div class="spend-meter" aria-hidden="true"><i></i><b></b><em></em></div>
      <div class="card-bottom"><span>•••• &nbsp; •••• &nbsp; •••• &nbsp; 2026</span><span class="mark"><i></i><i></i></span></div>
    </section>

    <section class="overview"><h2>Transactions</h2><div id="stats" class="stats"></div></section>
    <section class="controls" aria-label="Transaction filters">
      <input id="search" type="search" placeholder="Search transactions" autocomplete="off">
      <div class="filter-row"><div id="payments" class="chips"><button class="active" data-payment="all">All</button><button data-payment="upi">UPI</button><button data-payment="cash">Cash</button></div>
        <select id="preset" aria-label="Date range"><option value="all">All time</option><option value="month">This month</option><option value="today">Today</option><option value="7">7 days</option><option value="30">30 days</option></select>
        <select id="sort" aria-label="Sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="high">Highest</option><option value="low">Lowest</option></select>
      </div><div id="trend" class="trend" aria-label="Seven day spending trend"></div>
    </section>
    <section class="recent"><div class="section-title"><h2>Recent transactions</h2><button id="clear" class="link">Reset</button></div><div id="list" aria-live="polite"></div></section>
  </main>
  <nav class="bottom-nav" aria-label="Dashboard navigation"><span class="nav-active">⌂</span><span>▣</span><span class="nav-add">+</span><span>◔</span><span>♙</span></nav>
  <script type="module" src="app.js"></script>
</body>
</html>
