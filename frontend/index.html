<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e20">
  <title>Expenses</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Expense<span>.</span></h1><p id="status">Your spending overview</p></div>
      <button id="refresh" class="round" title="Refresh" aria-label="Refresh">↻</button>
    </header>

    <section class="hero">
      <div class="hero-row"><div><small>TOTAL EXPENSE</small><strong id="total">₹0</strong><p id="total-sub">0 transactions</p></div>
        <select id="preset" aria-label="Date range"><option value="all">All time</option><option value="month">This month</option><option value="today">Today</option><option value="7">7 days</option><option value="30">30 days</option></select>
      </div>
      <div id="trend" class="trend" aria-label="Seven day spending trend"></div>
    </section>

    <section class="overview"><h2>Overview</h2><div id="stats" class="stats"></div></section>
    <section class="controls">
      <input id="search" type="search" placeholder="Search expenses" autocomplete="off">
      <div id="payments" class="chips"><button class="active" data-payment="all">All</button><button data-payment="upi">UPI</button><button data-payment="cash">Cash</button></div>
      <select id="sort" aria-label="Sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="high">Highest amount</option><option value="low">Lowest amount</option></select>
    </section>
    <section><div class="section-title"><h2>Transactions</h2><button id="clear" class="link">Reset filters</button></div><div id="list" aria-live="polite"></div></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
