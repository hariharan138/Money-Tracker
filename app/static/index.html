<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151719" media="(prefers-color-scheme: dark)">
<title>Expenses — Mobile UI</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f6f7; --surface:#fff; --text:#17191b; --muted:#8a9097;
  --line:#e8eaed; --green:#42a66f; --green2:#65c18c;
  --dark:#202224; --dark2:#292b2e; --danger:#ff4d4d;
  --shadow:0 10px 30px rgba(20,30,25,.07);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; color:var(--text); background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:28px}
.top{
  padding:22px 20px 12px;display:flex;align-items:center;gap:12px;
}
.brand{font-size:24px;font-weight:750;letter-spacing:-.7px;flex:1}
.brand span{color:var(--green)}
.icon-btn{
  width:42px;height:42px;border:0;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.04);color:#34383c
}
.icon-btn:active{transform:scale(.96)}
.greeting{padding:4px 20px 18px;color:var(--muted);font-size:13px}
.hero{
  margin:0 16px 16px;border-radius:26px;padding:23px 22px 14px;
  background:linear-gradient(145deg,#26282a,#191b1d);color:#fff;
  box-shadow:0 18px 38px rgba(20,25,22,.18);overflow:hidden;position:relative
}
.hero:after{
  content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(101,193,140,.28);
  border-radius:50%;right:-110px;top:-95px;box-shadow:0 0 0 22px rgba(101,193,140,.05),0 0 0 44px rgba(101,193,140,.035)
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.hero-label{font-size:12px;color:#aeb3b7;margin-bottom:6px}
.hero-total{font-size:34px;font-weight:760;letter-spacing:-1.4px}
.hero-period{font-size:12px;color:#aeb3b7;margin-top:3px}
.month{
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
  color:#fff;border-radius:11px;padding:7px 10px;font-size:12px
}
.mstrip{
  display:flex;align-items:center;gap:8px;margin:0 16px 16px;padding:6px;
  border-radius:18px;background:var(--surface);box-shadow:var(--shadow)
}
.mnav{
  width:38px;height:38px;flex-shrink:0;border:0;border-radius:13px;background:#eef0f1;
  color:#4a5059;font-size:19px;line-height:1;display:grid;place-items:center
}
.mnav:disabled{color:#c2c7cc;opacity:.55;cursor:default}
.mcur{flex:1;min-width:0;border:0;border-radius:13px;background:transparent;padding:4px 6px;text-align:center}
.mname,.mamt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname{color:var(--text);font-size:14px;font-weight:700;letter-spacing:-.3px}
.mamt{margin-top:2px;color:var(--muted);font-size:11px;font-weight:600}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.mopt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  border:0;border-radius:14px;padding:11px 14px;background:#eef0f1;color:var(--text);text-align:left
}
.mopt.on{background:#202224;color:#fff}
.mopt b{display:block;font-size:13.5px}
.mopt small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.mopt.on small{color:#b9bdc4}
.mopt i{font-style:normal;font-size:13px;font-weight:700;flex-shrink:0}

.sumcard{
  margin:0 16px 16px;padding:16px 18px;border-radius:20px;
  background:var(--surface);box-shadow:var(--shadow)
}
.sumcard.searching{background:linear-gradient(150deg,#26282a,#191b1d);color:#fff}
.sumhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  color:var(--muted);font-size:11.5px;font-weight:650}
.sumcard.searching .sumhead{color:#b9bdc4}
.sumhead em{font-style:normal;flex-shrink:0;font-size:11px}
.sumtotal{margin-top:5px;font-size:27px;font-weight:760;letter-spacing:-1.1px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:13px}
.sumgrid div{padding:9px 10px;border-radius:12px;background:#eef0f1}
.sumcard.searching .sumgrid div{background:rgba(255,255,255,.09)}
.sumgrid small{display:block;color:var(--muted);font-size:10px;font-weight:650}
.sumcard.searching .sumgrid small{color:#a8acb3}
.sumgrid b{display:block;margin-top:3px;font-size:13px;font-weight:720;letter-spacing:-.3px}
.sumcats{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.sumcat{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  background:#eef0f1;font-size:11px;font-weight:650}
.sumcard.searching .sumcat{background:rgba(255,255,255,.1);color:#fff}

.chart{height:145px;margin-top:13px;position:relative;z-index:1}
.chart svg{width:100%;height:100%;overflow:visible}
.chart-line{fill:none;stroke:url(#stroke);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease forwards}
.chart-area{fill:url(#fade)}
.chart-grid{stroke:rgba(255,255,255,.07);stroke-width:1;vector-effect:non-scaling-stroke}
.chart-avg{stroke:#ffb02e;stroke-width:1;stroke-dasharray:4 4;opacity:.8;vector-effect:non-scaling-stroke}
.chart-dot{fill:#fff;stroke:#55bd82;stroke-width:3;vector-effect:non-scaling-stroke}
.chart-cursor{stroke:rgba(255,255,255,.35);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.chart-line{animation:none;stroke-dashoffset:0}}
.tooltip{
  position:absolute;right:9px;top:17px;background:#fff;color:#202224;
  padding:8px 12px;border-radius:12px;font-size:11px;font-weight:650;
  box-shadow:0 8px 20px rgba(0,0,0,.2)
}
.tooltip small{display:block;color:#8b9095;font-weight:500;margin-top:2px}
.chart-days{display:flex;justify-content:space-between;color:#777e84;font-size:10px;margin-top:-3px}
.chart-days b{color:#fff}
.section-head{display:flex;align-items:center;padding:0 20px 10px}
.section-head h2{font-size:19px;letter-spacing:-.4px;margin:0;flex:1}
.section-head a{font-size:12px;color:#666d73;text-decoration:underline;cursor:pointer}
.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 20px
}
.stat{
  background:#fff;border-radius:18px;padding:15px;box-shadow:0 3px 15px rgba(0,0,0,.035)
}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:7px}
.stat-value{font-size:19px;font-weight:720;letter-spacing:-.4px}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px}
.search-wrap{padding:0 16px 13px;display:none}
.search{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:12px 14px;outline:none
}
.search:focus{border-color:var(--green)}
.filters{padding:0 16px 8px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}
.filters:last-child{padding-bottom:15px}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:0;background:#e9ecee;color:#555c61;border-radius:999px;
  padding:8px 13px;font-size:12px
}
.chip.on{background:#202224;color:#fff}
.transactions{padding:0 16px}
.day-title{
  display:flex;justify-content:space-between;align-items:center;margin:7px 2px 8px;
  color:#92979c;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:650
}
.list{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 3px 15px rgba(0,0,0,.035);margin-bottom:14px}
.tx{
  min-height:72px;padding:13px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)
}
.tx:last-child{border-bottom:0}
.tx-icon{
  width:43px;height:43px;border-radius:14px;background:#f1f3f4;display:grid;place-items:center;
  font-size:20px;flex:0 0 43px
}
.tx-main{min-width:0;flex:1}
.tx-cat{font-size:14px;font-weight:680}
.tx-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tx-meta{font-size:10px;color:#a0a5a9;margin-top:3px}
.tx-amt{font-size:14px;font-weight:720;white-space:nowrap}
.del{border:0;background:none;color:#c3c8cc;font-size:17px;line-height:1;padding:6px 4px;display:grid;place-items:center}
.del:active{color:var(--danger);transform:scale(.9)}
.empty{background:#fff;border-radius:20px;padding:42px 20px;text-align:center;color:var(--muted)}
.skeleton-list{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 3px 15px rgba(0,0,0,.035);margin-bottom:14px}
.skeleton-row{height:72px;padding:13px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.skeleton-row:last-child{border-bottom:0}
.skeleton-block{border-radius:8px;background:linear-gradient(90deg,#eceff0 25%,#f7f8f8 37%,#eceff0 63%);background-size:400% 100%;animation:shimmer 1.25s ease-in-out infinite}
.skeleton-icon{width:43px;height:43px;border-radius:14px;flex:0 0 43px}.skeleton-copy{flex:1}.skeleton-title{width:42%;height:13px}.skeleton-sub{width:67%;height:10px;margin-top:8px}.skeleton-amount{width:42px;height:13px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.sheet{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);
  background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 30px
}
@media(min-width:700px){
  body{padding:20px 0;background:var(--bg)}
  .app{background:var(--bg);border-radius:32px;box-shadow:0 20px 70px rgba(0,0,0,.1);min-height:calc(100vh - 40px);overflow:hidden}
}
.handle{width:42px;height:4px;border-radius:99px;background:#d7dadd;margin:3px auto 18px}
.sheet h3{margin:0 0 15px;font-size:20px}
.sheet-row{display:flex;gap:8px;overflow:auto;padding-bottom:5px}
.sheet-row button{border:0;background:#eef0f1;border-radius:12px;padding:10px 14px}
.sheet-row button.on{background:#202224;color:#fff}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#151719;--surface:#202326;--text:#f2f4f5;--muted:#a8afb5;
    --line:#34383c;--dark:#101214;--dark2:#1a1d20;--shadow:0 10px 30px rgba(0,0,0,.28)
  }
  html,body,.app{background:var(--bg)}
  .icon-btn,.stat,.list,.empty,.search,.sheet{background:var(--surface);color:var(--text)}
  .icon-btn{color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.22)}
  .stat,.list{box-shadow:0 3px 15px rgba(0,0,0,.18)}
  .skeleton-list{box-shadow:0 3px 15px rgba(0,0,0,.18)}
  .skeleton-block{background:linear-gradient(90deg,#2a2e32 25%,#353a3f 37%,#2a2e32 63%);background-size:400% 100%}
  .tx-icon{background:#2a2e32}
  .chip{background:#2a2e32;color:#d8dde0}
  .mnav,.mopt,.sumgrid div,.sumcat{background:#2a2e32;color:#d8dde0}
  .mopt.on{background:#f2f4f5;color:#17191b}
  .mopt.on small{color:#5b6068}
  .mstrip,.sumcard{background:var(--surface)}
  .chip.on,.sheet-row button.on{background:#f2f4f5;color:#17191b}
  .sheet-row button{background:#2a2e32;color:#d8dde0}
  .search{border-color:var(--line)}
  .search::placeholder{color:#8f979e}
  .del{color:#8f979e}
  .greeting,.stat-label,.stat-sub,.tx-desc{color:var(--muted)}
  .day-title{color:#aeb4ba}
  .top{background:var(--bg)}
}
@media(min-width:700px){
  body{padding:20px 0;background:var(--bg)}
  .app{background:var(--bg);border-radius:32px;box-shadow:0 20px 70px rgba(0,0,0,.1);min-height:calc(100vh - 40px);overflow:hidden}
  .bottom{position:sticky;bottom:0;border-radius:0 0 32px 32px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Expense<span>.</span></div>
    <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
    <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
  </header>
  <div class="greeting" id="updated">Your spending overview</div>

  <div class="mstrip">
    <button class="mnav" id="mPrev" type="button" aria-label="Previous month">&lsaquo;</button>
    <button class="mcur" id="mPick" type="button" aria-label="Choose a month">
      <span class="mname" id="mName">&mdash;</span>
      <span class="mamt" id="mAmt"></span>
    </button>
    <button class="mnav" id="mNext" type="button" aria-label="Next month">&rsaquo;</button>
  </div>

  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label" id="heroLabel">TOTAL EXPENSE</div>
        <div class="hero-total" id="total">₹0</div>
        <div class="hero-period" id="totalSub">This month</div>
      </div>
      <select class="month" id="preset" aria-label="Date range">
        <option value="month" selected>Whole month</option>
        <option value="today">Today</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </div>

    <div class="chart">
      <svg id="trendSvg" viewBox="0 0 500 150" preserveAspectRatio="none" aria-label="Spending for the selected month">
        <defs>
          <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#55bd82" stop-opacity=".30"/>
            <stop offset=".65" stop-color="#55bd82" stop-opacity=".07"/>
            <stop offset="1" stop-color="#55bd82" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="stroke" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#65c18c"/>
            <stop offset="1" stop-color="#42a66f"/>
          </linearGradient>
        </defs>
        <line class="chart-grid" x1="0" y1="120" x2="500" y2="120"/>
        <line class="chart-grid" x1="0" y1="78" x2="500" y2="78"/>
        <line class="chart-grid" x1="0" y1="36" x2="500" y2="36"/>
        <g id="plot"></g>
      </svg>
      <div class="tooltip" id="tooltip">₹0<small>—</small></div>
      <div class="chart-days" id="chartDays"></div>
    </div>
  </section>

  <div class="section-head">
    <h2>Overview</h2>
    <a id="clear">Reset filters</a>
  </div>
  <section class="stats" id="stats"></section>

  <div class="search-wrap" id="searchWrap">
    <input class="search" id="q" type="search" placeholder="Search description, notes, category…" autocomplete="off">
  </div>

  <div class="filters" id="paymentMethods" aria-label="Payment method filter">
    <button class="chip on" data-payment="all">All</button>
    <button class="chip" data-payment="upi">UPI</button>
    <button class="chip" data-payment="cash">Cash</button>
  </div>

  <section class="sumcard" id="sumCard" aria-live="polite"></section>

  <section class="transactions">
    <div class="section-head" style="padding-left:2px;padding-right:2px">
      <h2>Transactions</h2>
      <a id="sortBtn">Newest</a>
    </div>
    <div id="loadingSkeleton" class="skeleton-list" role="status" aria-label="Loading expenses" hidden>
      <div class="skeleton-row"><div class="skeleton-block skeleton-icon"></div><div class="skeleton-copy"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-sub"></div></div><div class="skeleton-block skeleton-amount"></div></div>
      <div class="skeleton-row"><div class="skeleton-block skeleton-icon"></div><div class="skeleton-copy"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-sub"></div></div><div class="skeleton-block skeleton-amount"></div></div>
      <div class="skeleton-row"><div class="skeleton-block skeleton-icon"></div><div class="skeleton-copy"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-sub"></div></div><div class="skeleton-block skeleton-amount"></div></div>
    </div>
    <div id="list"></div>
  </section>
</div>


<div class="sheet-backdrop" id="monthSheet">
  <div class="sheet">
    <div class="handle"></div>
    <h3>Choose a month</h3>
    <div class="mlist" id="mList"></div>
  </div>
</div>

<div class="sheet-backdrop" id="sortSheet">
  <div class="sheet">
    <div class="handle"></div>
    <h3>Sort transactions</h3>
    <div class="sheet-row">
      <button data-sort="newest" class="on">Newest</button>
      <button data-sort="oldest">Oldest</button>
      <button data-sort="high">Highest amount</button>
      <button data-sort="low">Lowest amount</button>
    </div>
  </div>
</div>

<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = new URLSearchParams(location.search).get('key') || '';
const INR = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
// Render's Free instances can take about a minute to wake after idling.
const COLD_START_TIMEOUT_MS = 90_000;
const EMOJI = {
  food:'🍜',groceries:'🛒',grocery:'🛒',travel:'✈️',cab:'🚕',fuel:'⛽',
  bills:'🧾',rent:'🏠',health:'💊',fitness:'🏋️',entertainment:'🎬',
  shopping:'🛍️',coffee:'☕',education:'📚',gifts:'🎁',upi:'↗️',cash:'💵'
};
const emo = c => EMOJI[(c||'').trim().toLowerCase()] || '🏷️';

let raw = $('#bootstrap').textContent.trim();
let docs = [];
let hasBootstrapData=false;
try {
  if(raw && raw !== '__BOOTSTRAP__'){
    docs=JSON.parse(raw);
    hasBootstrapData=true;
  }
} catch(e){ docs=[]; }
let waitingForInitialData=!hasBootstrapData;

const ALL_MONTHS='all';
// The month every part of this page reads. 'YYYY-MM', or ALL_MONTHS.
const state = {q:'',preset:'month',payment:'all',sort:'newest',month:''};
let monthPinned=false;   // true once you pick a month yourself
let lastFetch = new Date();
let chart = null;
let coldRetries=0;            // cap the cold-start retry loop
const MAX_COLD_RETRIES=10;

/* MongoDB stores dates in UTC, but its JSON representation can omit the
   offset (for example, "2026-08-23T19:30:00").  Browsers interpret that form
   as a device-local time, which made server timestamps appear several hours
   off and sometimes placed them under the wrong day. */
function expenseDate(value){
  if(!value)return null;
  if(value instanceof Date)return value;
  const text=String(value);
  const hasTimezone=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(text);
  return new Date(hasTimezone ? text : text+'Z');
}
function dayKey(d){
  const x=expenseDate(d)||new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
function monthKeyOf(v){
  const x=expenseDate(v)||new Date(v);
  if(isNaN(x.getTime()))return'';
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
}
function thisMonth(){return monthKeyOf(new Date())}
function monthParts(k){return k.split('-').map(Number)}
function daysInMonth(k){const [y,m]=monthParts(k);return new Date(y,m,0).getDate()}
function monthBounds(k){const [y,m]=monthParts(k);return [new Date(y,m-1,1),new Date(y,m,0,23,59,59,999)]}
function shiftMonth(k,d){const [y,m]=monthParts(k);return monthKeyOf(new Date(y,m-1+d,1))}
function monthLabel(k){
  if(!k||k===ALL_MONTHS)return'All time';
  const [y,m]=monthParts(k);
  return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function inMonth(d,k){return k===ALL_MONTHS||monthKeyOf(d.date)===k}
function monthDocs(k){k=k||state.month;return k===ALL_MONTHS?docs:docs.filter(d=>inMonth(d,k))}
/** Months with expenses, newest first; this month and the selection always in. */
function monthsWithData(){
  const keys=new Set(docs.map(d=>monthKeyOf(d.date)).filter(Boolean));
  keys.add(thisMonth());
  if(state.month&&state.month!==ALL_MONTHS)keys.add(state.month);
  return [...keys].sort().reverse();
}
/** Day-relative presets only mean something when today is in the window. */
function presetAllowed(){return state.month===ALL_MONTHS||state.month===thisMonth()}
/* Opening on an empty month is the one thing the old "widen to all time"
   rule was there to prevent. Keep that, month-wise: start on the newest
   month that actually has something in it. */
function pickInitialMonth(){
  if(monthPinned)return;
  const now=thisMonth();
  state.month=(!docs.length||docs.some(d=>monthKeyOf(d.date)===now))?now:monthsWithData()[0];
}
function setMonth(k){
  if(state.month===k)return;
  monthPinned=true;
  state.month=k;
  if(!presetAllowed()&&state.preset!=='month'){state.preset='month';$('#preset').value='month'}
  render();
}
function setLoading(show){
  $('#loadingSkeleton').hidden=!show;
  $('#list').hidden=show;
  $('#list').setAttribute('aria-busy',String(show));
}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function rangeFor(p){
  const now=new Date();
  let lo=null,hi=null;
  if(state.month!==ALL_MONTHS)[lo,hi]=monthBounds(state.month);
  if(presetAllowed()){
    const start=p==='today'?startOfDay(now)
      :p==='7'?new Date(startOfDay(now)-6*864e5)
      :p==='30'?new Date(startOfDay(now)-29*864e5):null;
    if(start&&(!lo||start>lo))lo=start;   // a preset can only narrow the month
  }
  return [lo,hi];
}
function filtered(){
  const [lo,hi]=rangeFor(state.preset);
  const q=state.q.trim().toLowerCase();
  let arr=docs.filter(d=>{
    const date=expenseDate(d.date);
    const t=date?date.getTime():0;
    if(lo&&t<lo.getTime())return false;
    if(hi&&t>hi.getTime())return false;
    if(state.payment!=='all' && (d.payment_method||'').trim().toLowerCase()!==state.payment)return false;
    if(q){
      const hay=((d.category||'')+' '+(d.description||'')+' '+(d.notes||'')+' '+(d.payment_method||'')).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const cmp={
    newest:(a,b)=>(expenseDate(b.date)?.getTime()||0)-(expenseDate(a.date)?.getTime()||0),
    oldest:(a,b)=>(expenseDate(a.date)?.getTime()||0)-(expenseDate(b.date)?.getTime()||0),
    high:(a,b)=>b.amount-a.amount,
    low:(a,b)=>a.amount-b.amount
  }[state.sort];
  return arr.sort(cmp);
}
function sum(a){return a.reduce((s,d)=>s+Number(d.amount||0),0)}
function cnt(a,f){return a.reduce((m,d)=>{const k=f(d)||'–';m[k]=(m[k]||0)+Number(d.amount||0);return m},{});}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);
  return d.innerHTML.replaceAll('"','&quot;').replaceAll("'",'&#39;')}  // quotes too: esc() also fills attributes
function dayLabel(k){
  const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d),now=new Date();
  if(k===dayKey(now))return'Today';
  if(k===dayKey(new Date(now-864e5)))return'Yesterday';
  return dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}
function render(){
  if(!monthPinned)pickInitialMonth();   // re-evaluated as data arrives
  const arr=filtered(), total=sum(arr), now=new Date(), todayK=dayKey(now);
  const isAll=state.month===ALL_MONTHS, live=state.month===thisMonth();
  const mDocs=monthDocs(), mTotal=sum(mDocs);
  const today=sum(docs.filter(d=>dayKey(d.date)===todayK));
  renderMonthStrip(mDocs,mTotal,isAll);
  syncPreset();
  $('#heroLabel').textContent=isAll?'TOTAL EXPENSE':'SPENT IN '+monthLabel(state.month).toUpperCase();
  $('#total').textContent=INR.format(total);
  $('#totalSub').textContent=(arr.length===mDocs.length?'':'Filtered · ')+arr.length+' transaction'+(arr.length===1?'':'s');
  const days=isAll?0:daysInMonth(state.month);
  $('#stats').innerHTML=(live||isAll
    ? [['Today',INR.format(today),'Spent today'],
       [isAll?'All time':monthLabel(state.month),INR.format(mTotal),'Whole month']]
    : [[monthLabel(state.month),INR.format(mTotal),'Whole month'],
       ['Daily average',INR.format(days?mTotal/days:0),'Across the month']]
  ).map(x=>`<div class="stat"><div class="stat-label">${esc(x[0])}</div><div class="stat-value">${x[1]}</div><div class="stat-sub">${esc(x[2])}</div></div>`).join('');
  renderSummary(arr);

  const groups=new Map();
  for(const d of arr){const k=dayKey(d.date);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d)}
  let out='';
  for(const [k,items] of groups){
    out+=`<div class="day-title"><span>${dayLabel(k)}</span><span>${INR.format(sum(items))}</span></div>`;
    out+='<div class="list">'+items.map(row).join('')+'</div>';
  }
  if(!arr.length) out=docs.length
    ? '<div class="empty">No expenses match your filters.<br><br><button class="chip on" onclick="clearAll()">Show everything</button></div>'
    : '<div class="empty">No expenses yet.<br><br>Add your first expense from the iPhone Shortcut.</div>';
  $('#list').innerHTML=out;
  $('#clear').style.visibility=(state.q||state.preset!=='month'||state.payment!=='all'||state.month!==thisMonth())?'visible':'hidden';
  buildChart();
}

function renderMonthStrip(mDocs,mTotal,isAll){
  const months=monthsWithData(), oldest=months[months.length-1];
  $('#mName').textContent=monthLabel(state.month);
  $('#mAmt').textContent=INR.format(mTotal);
  $('#mPrev').disabled=isAll||state.month<=oldest;
  $('#mNext').disabled=isAll||state.month>=thisMonth();
}

function renderMonthList(){
  const opt=(k,name,meta,total)=>`<button class="mopt${state.month===k?' on':''}" type="button" data-month="${esc(k)}">`
    +`<span><b>${esc(name)}</b><small>${esc(meta)}</small></span><i>${INR.format(total)}</i></button>`;
  const rows=monthsWithData().map(k=>{
    const items=monthDocs(k);
    return opt(k,monthLabel(k),items.length+' transaction'+(items.length===1?'':'s'),sum(items));
  }).join('');
  $('#mList').innerHTML=rows
    +opt(ALL_MONTHS,'All time',docs.length+' transaction'+(docs.length===1?'':'s'),sum(docs));
}

/* "Whole month" is a lie while All time is selected, and the day-relative
   windows cannot apply to a month that does not contain today. */
function syncPreset(){
  const sel=$('#preset'), allowed=presetAllowed();
  [...sel.options].forEach(o=>{if(o.value!=='month')o.disabled=!allowed});
  sel.options[0].textContent=state.month===ALL_MONTHS?'All time':'Whole month';
  sel.value=state.preset;
}

/** The total for exactly what is on screen -- the answer to a search. */
function renderSummary(arr){
  const card=$('#sumCard'), q=state.q.trim();
  const scope=state.month===ALL_MONTHS?'all time':monthLabel(state.month);
  const win={today:'today','7':'last 7 days','30':'last 30 days'}[state.preset];
  const where=win&&presetAllowed()?scope+' · '+win:scope;
  card.classList.toggle('searching',Boolean(q));
  if(!arr.length){
    card.innerHTML=`<div class="sumhead"><span>${q?'No match for “'+esc(q)+'”':'Nothing here yet'}</span></div>`
      +`<div class="sumtotal">${INR.format(0)}</div><div class="sumhead"><span>${esc(where)}</span></div>`;
    return;
  }
  const amounts=arr.map(d=>Number(d.amount||0));
  const total=amounts.reduce((a,b)=>a+b,0);
  const cats=Object.entries(cnt(arr,d=>(d.category||'Expense').trim()||'Expense')).sort((a,b)=>b[1]-a[1]);
  card.innerHTML=
    `<div class="sumhead"><span>${q?'Total for “'+esc(q)+'”':'Total'}</span><em>${esc(where)}</em></div>`
    +`<div class="sumtotal">${INR.format(total)}</div>`
    +`<div class="sumgrid">`
    +`<div><small>Transactions</small><b>${arr.length}</b></div>`
    +`<div><small>Average</small><b>${INR.format(total/arr.length)}</b></div>`
    +`<div><small>Largest</small><b>${INR.format(Math.max(...amounts))}</b></div></div>`
    +(cats.length>1?`<div class="sumcats">`+cats.slice(0,4).map(([n,v])=>
        `<span class="sumcat">${emo(n)} ${esc(n)} <b>${INR.format(v)}</b></span>`).join('')+`</div>`:'');
}
/* One point per day of the selected month, so the chart answers the same
   question as everything else on the page. Redrawn only when its numbers
   move: render() also runs on the poll, and rebuilding it every time
   replayed the draw-in and threw away the day you were reading. */
let chartSig=null;
function buildChart(){
  const key=state.month===ALL_MONTHS?thisMonth():state.month;
  const [y,m]=monthParts(key), n=daysInMonth(key);
  const payOk=t=>state.payment==='all'||(t.payment_method||'').trim().toLowerCase()===state.payment;
  const byDay=new Map();
  for(const t of docs){if(payOk(t)){const k=dayKey(t.date);byDay.set(k,(byDay.get(k)||0)+Number(t.amount||0))}}
  const days=[...Array(n)].map((_,i)=>new Date(y,m-1,i+1));
  const totals=days.map((d,i)=>byDay.get(key+'-'+String(i+1).padStart(2,'0'))||0);

  const sig=JSON.stringify([key,state.payment,totals]);
  if(sig===chartSig&&$('#plot').firstChild)return;
  chartSig=sig;

  const max=Math.max(...totals,1);
  const W=500,H=150,topPad=24,botPad=28,step=n>1?W/(n-1):0;
  const pts=totals.map((v,i)=>[n>1?i*step:W/2, H-botPad-(v/max)*(H-topPad-botPad)]);
  let dLine=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const [px,py]=pts[i-1],[x,cy]=pts[i],cx=((px+x)/2).toFixed(1);
    dLine+=` C${cx},${py.toFixed(1)} ${cx},${cy.toFixed(1)} ${x.toFixed(1)},${cy.toFixed(1)}`;
  }
  const spent=totals.reduce((a,b)=>a+b,0);
  const avgY=H-botPad-((spent/n)/max)*(H-topPad-botPad);
  const todayI=days.findIndex(d=>dayKey(d)===dayKey(new Date()));
  const peakI=totals.indexOf(Math.max(...totals));
  $('#plot').innerHTML=
    `<path class="chart-area" d="${dLine} L${W},${H} L0,${H} Z"/>`+
    `<line class="chart-avg" x1="0" y1="${avgY.toFixed(1)}" x2="${W}" y2="${avgY.toFixed(1)}"/>`+
    `<path class="chart-line" pathLength="1" d="${dLine}"/>`+
    `<line class="chart-cursor" id="cursorLine" x1="0" y1="${topPad}" x2="0" y2="${H-botPad}" style="display:none"/>`+
    `<circle class="chart-dot" id="cursorDot" cx="0" cy="0" r="4.5" style="display:none"/>`;
  // Labels are plain HTML: the SVG is stretched to fit, which would squash text.
  $('#chartDays').innerHTML=days.map((d,i)=>{
    const day=i+1, show=day===1||day%5===0;
    if(!show)return'<span></span>';
    return i===todayI?`<b>${day}</b>`:`<span>${day}</span>`;
  }).join('');
  chart={pts,days,totals,key};
  setTip(todayI>=0?todayI:peakI);
}
function setTip(i){
  if(!chart)return;
  const {pts,days,totals}=chart;
  i=Math.max(0,Math.min(pts.length-1,i));
  const line=$('#cursorLine'),dot=$('#cursorDot');
  if(line){line.style.display='';line.setAttribute('x1',pts[i][0]);line.setAttribute('x2',pts[i][0])}
  if(dot){dot.style.display='';dot.setAttribute('cx',pts[i][0]);dot.setAttribute('cy',pts[i][1])}
  $('#tooltip').innerHTML=`${INR.format(totals[i])}`
    +`<small>${esc(days[i].toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}))}</small>`;
}
function row(d){
  const date=expenseDate(d.date);
  const t=date?date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
  return `<div class="tx">
    <div class="tx-icon">${emo(d.category)}</div>
    <div class="tx-main">
      <div class="tx-cat">${esc(d.category||'Expense')}</div>
      <div class="tx-desc">${esc(d.description||d.notes||'Expense')}</div>
      <div class="tx-meta">${esc(t)}${d.payment_method?' · '+esc(d.payment_method):''}</div>
    </div>
    <div class="tx-amt">-${INR.format(Number(d.amount||0))}</div>
    <button class="del" title="Delete" onclick="del('${esc(d.id)}')">×</button>
  </div>`;
}
function clearAll(){
  state.q='';state.preset='month';state.payment='all';state.sort='newest';
  state.month=thisMonth();monthPinned=false;
  $('#q').value='';$('#preset').value='month';
  document.querySelectorAll('[data-payment]').forEach(b=>b.classList.toggle('on',b.dataset.payment==='all'));
  render();
}
window.clearAll=clearAll;
window.del=async id=>{
  if(!confirm('Delete this expense?'))return;
  const r=await fetch('/api/expenses/'+encodeURIComponent(id)+'?key='+encodeURIComponent(KEY),{method:'DELETE'});
  if(r.ok){docs=docs.filter(d=>d.id!==id);render()}else alert('Could not delete ('+r.status+')');
};
async function refresh(){
  $('#refresh').textContent='⟳';
  $('#updated').textContent='Refreshing...';
  setLoading(true);
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),COLD_START_TIMEOUT_MS);
    const r=await fetch('/api/expenses?key='+encodeURIComponent(KEY)+'&limit=1000',{
      cache:'no-store',
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(r.status===401){location.href='/';return}
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    if(j.success && j.expenses){
      docs=j.expenses;
      coldRetries=0;
      waitingForInitialData=false;
      lastFetch=new Date();
      stamp();
      setLoading(false);
      render();
      $('#updated').textContent='Updated just now';
    }else{
      throw new Error('Invalid response format');
    }
  }catch(e){
    if(e.name==='AbortError' && coldRetries<MAX_COLD_RETRIES){
      coldRetries++;
      $('#updated').textContent='Server waking up... (cold start)';
      setTimeout(refresh,2000); // Retry after 2 seconds
    }else{
      console.error('Refresh error:', e);
      setLoading(false);
      stamp('Offline · showing saved data');
    }
  }
  finally{$('#refresh').textContent='↻'}
}
function stamp(note){
  if(note){$('#updated').textContent=note;return}
  const s=Math.round((Date.now()-lastFetch.getTime())/1000);
  $('#updated').textContent=s<8?'Updated just now':'Updated '+(s<60?s+'s ago':Math.round(s/60)+'m ago');
}
$('#refresh').onclick=refresh;
$('#preset').onchange=e=>{state.preset=e.target.value;render()};
$('#q').oninput=e=>{state.q=e.target.value;render()};
$('#paymentMethods').onclick=e=>{
  const b=e.target.closest('[data-payment]');
  if(!b)return;
  state.payment=b.dataset.payment;
  document.querySelectorAll('[data-payment]').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
$('#searchBtn').onclick=()=>{
  const w=$('#searchWrap');w.style.display=w.style.display==='block'?'none':'block';
  if(w.style.display==='block')setTimeout(()=>$('#q').focus(),50);
};
$('#clear').onclick=clearAll;
$('#mPrev').onclick=()=>setMonth(shiftMonth(state.month,-1));
$('#mNext').onclick=()=>setMonth(shiftMonth(state.month,1));
$('#mPick').onclick=()=>{renderMonthList();$('#monthSheet').style.display='block'};
$('#monthSheet').onclick=e=>{
  if(e.target.id==='monthSheet'){$('#monthSheet').style.display='none';return}
  const b=e.target.closest('[data-month]');
  if(!b)return;
  $('#monthSheet').style.display='none';
  setMonth(b.dataset.month);
};
$('#sortBtn').onclick=()=>$('#sortSheet').style.display='block';
$('#sortSheet').onclick=e=>{
  if(e.target.id==='sortSheet')$('#sortSheet').style.display='none';
  const b=e.target.closest('[data-sort]');
  if(!b)return;
  state.sort=b.dataset.sort;
  document.querySelectorAll('[data-sort]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $('#sortBtn').textContent=b.textContent;$('#sortSheet').style.display='none';render();
};

function scrub(e){
  if(!chart)return;
  const r=$('#trendSvg').getBoundingClientRect();
  setTip(Math.round((e.clientX-r.left)/r.width*(chart.pts.length-1)));
}
$('#trendSvg').onpointerdown=scrub;
$('#trendSvg').onpointermove=e=>{if(e.pointerType==='mouse'||e.buttons)scrub(e)};
/* live data: silent poll + instant refresh when the tab becomes visible/focused
   Aggressive strategy to keep server awake on Render.com:
   - 5-minute polling when visible
   - 2-minute lightweight keep-alive pings even when hidden
   - Immediate refresh on visibility change
   This dual approach ensures server stays awake regardless of user activity */
let pollInterval=300000; // 5 minutes - more frequent to prevent sleep
let pollTimer=null;
let isWakingUp=false;
async function poll(){
  if(isWakingUp)return; // Prevent multiple polls during cold start
  try{
    isWakingUp=true;
    if(waitingForInitialData)setLoading(true);
    $('#updated').textContent='Loading...';
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),COLD_START_TIMEOUT_MS);
    const r=await fetch('/api/expenses?key='+encodeURIComponent(KEY)+'&limit=1000',{
      cache:'no-store',
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(r.status===401){location.href='/';return}
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    if(j.success && j.expenses){
      docs=j.expenses;
      coldRetries=0;
      waitingForInitialData=false;
      lastFetch=new Date();
      stamp();
      setLoading(false);
      render();
    }else{
      throw new Error('Invalid response format');
    }
  }catch(e){
    if(e.name==='AbortError' && coldRetries<MAX_COLD_RETRIES){
      coldRetries++;
      $('#updated').textContent='Server waking up... (cold start)';
      // Retry after 2 seconds for cold start
      setTimeout(poll,2000);
    }else{
      console.error('Poll error:', e);
      waitingForInitialData=false;
      setLoading(false);
      $('#updated').textContent='Offline · showing saved data';
    }
  }finally{
    isWakingUp=false;
  }
}
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(poll,pollInterval);
}
function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}
// Additional keep-alive: ping the server every 2 minutes even when hidden
let keepAliveTimer=null;
function startKeepAlive(){
  if(keepAliveTimer)clearInterval(keepAliveTimer);
  keepAliveTimer=setInterval(async()=>{
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),10000); // 10 second timeout
      await fetch('/ping',{
        cache:'no-store',
        signal:controller.signal
      });
      clearTimeout(timeout);
      // Also call warmup to ensure database is ready
      try{
        const warmupController=new AbortController();
        const warmupTimeout=setTimeout(()=>warmupController.abort(),5000); // 5 second timeout
        await fetch('/warmup',{
          cache:'no-store',
          signal:warmupController.signal
        });
        clearTimeout(warmupTimeout);
      }catch(e){
        // Warmup failure is ok - server might still be starting
      }
    }catch(e){
      // Silent failure for keep-alive - will retry on next interval
    }
  },120000); // 2 minutes
}
function stopKeepAlive(){
  if(keepAliveTimer){clearInterval(keepAliveTimer);keepAliveTimer=null;}
}
// Adaptive polling: keep-alive when hidden, full polling when visible
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    stopPolling(); // save resources when tab not visible
    startKeepAlive(); // but keep server alive with lightweight pings
  }else{
    stopKeepAlive();
    poll(); // immediate refresh on visibility
    startPolling();
  }
});
window.addEventListener('focus',poll);
startPolling(); // start with full polling when page loads
startKeepAlive(); // also start keep-alive as extra insurance
document.onkeydown=e=>{
  if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#searchBtn').click()}
  if(e.key==='r'&&!e.metaKey&&!e.ctrlKey&&document.activeElement.tagName!=='INPUT')refresh();
};
try{stamp();if(waitingForInitialData)setLoading(true);else render()}catch(e){/* startPolling() will refresh with fresh data */}
poll();  // open → show live data immediately, no refresh tap needed
</script>
